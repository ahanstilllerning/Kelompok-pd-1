<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Keranjang Saya</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      margin: 0;
      padding: 5rem;
    }

    .cart-container {
      width: 30rem;
      background-color: #fff;
      margin: 20px auto;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .cart-header {
      background-color: #e6e6e6;
      padding: 15px;
      font-weight: bold;
      text-align: center;
    }
    .back {
      display: flex;
      padding-top: 10px;
      display: inline;
      text-align: center;
    }

    .cart-header .back-arrow {
      margin-right: 10px;
      font-size: 18px;
      cursor: pointer;
      text-decoration: none;
      color: black;
      border: none;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
      border-bottom: 1px solid #eee;
    }

    .cart-item .item-info {
      flex: 1;
      font-size: 16px;
    }

    .quantity-control {
      display: flex;
      align-items: center;
      border: 1px solid #ccc;
      border-radius: 5px;
      overflow: hidden;
    }

    .quantity-control button {
      width: 30px;
      height: 30px;
      border: none;
      background-color: #fff;
      font-size: 18px;
      cursor: pointer;
    }

    .quantity-control span {
      width: 30px;
      text-align: center;
      font-size: 16px;
    }

    .cart-footer {
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .checkout-btn {
      background-color: white;
      border: 1px solid #ccc;
      border-radius: 5px;
      padding: 8px 16px;
      cursor: pointer;
      font-weight: bold;
    }

    .checkout-btn:hover {
      background-color: #f0f0f0;
    }
  </style>
</head>
<body>

<div class="cart-container">
  <div class="cart-header">
    <div class="back">
    <a class="back-arrow" href="NAVBAR-AFTER.html">Back</a>
    
    Keranjang Saya
    </div>
  </div>

  <!-- Item 1 -->
  <div class="cart-item">
    <div class="item-info">Rp.</div>
    <div class="quantity-control">
      <button>-</button>
      <span>1</span>
      <button>+</button>
    </div>
  </div>

  <!-- Item 2 -->
  <div class="cart-item">
    <div class="item-info">Rp.</div>
    <div class="quantity-control">
      <button>-</button>
      <span>1</span>
      <button>+</button>
    </div>
  </div>

  <!-- Item 3 -->
  <div class="cart-item">
    <div class="item-info">Rp.</div>
    <div class="quantity-control">
      <button>-</button>
      <span>1</span>
      <button>+</button>
    </div>
  </div>

  <!-- Footer -->
  <div class="cart-footer">
    <div>Total: <strong>Rp.</strong></div>
    <button class="checkout-btn">Checkout</button>
  </div>
</div>

</body>
</html>
